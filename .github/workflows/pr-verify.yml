name: PR Verify

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: PR Verify
    runs-on: ubuntu-latest
    env:
      PACKAGE_OUTPUT: ${{ github.workspace }}/artifacts/packages
      PACKAGE_VERSION: 1.0.0-ci.${{ github.run_id }}.${{ github.run_attempt }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Full history needed for MinVer
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          dotnet-version: |
            10.0.x
            11.0.x

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Release-gate script tests
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'
          python3 scripts/check-package-docs.py --self-test

      - name: Shipped API matches the released baseline
        run: python3 scripts/check-api-release-baseline.py

      - name: dotnet restore (locked)
        run: dotnet restore Boutquin.Mediator.slnx --locked-mode

      - name: Verify assembly-version policy boundaries
        shell: bash
        run: |
          set -euo pipefail
          test "$(dotnet msbuild src/Mediator/Boutquin.Mediator.csproj -target:GetAssemblyVersion -property:TargetFramework=net10.0 -property:MinVerVersionOverride=0.10.7-policyprobe.1 -getProperty:AssemblyVersion)" = "0.10.0.0"
          test "$(dotnet msbuild src/Mediator/Boutquin.Mediator.csproj -target:GetAssemblyVersion -property:TargetFramework=net10.0 -property:MinVerVersionOverride=1.2.3-policyprobe.1 -getProperty:AssemblyVersion)" = "1.0.0.0"

      - name: Build with dotnet
        run: dotnet build Boutquin.Mediator.slnx --configuration Release --no-restore --no-incremental -p:GeneratePackageOnBuild=false -p:MinVerVersionOverride="$PACKAGE_VERSION"

      - name: dotnet test with coverage
        run: dotnet test Boutquin.Mediator.slnx --configuration Release --no-build --no-restore --collect:"XPlat Code Coverage" --results-directory ./coverage

      - name: Upload coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage/
        if: always()

      - name: dotnet format
        run: dotnet format Boutquin.Mediator.slnx -v detailed --verify-no-changes --no-restore

      - name: Pack and verify packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PACKAGE_OUTPUT"
          test -z "$(find "$PACKAGE_OUTPUT" -mindepth 1 -print -quit)"
          for project in Abstractions Reliability Mediator.Abstractions Mediator Mediator.Authorization Mediator.Caching Mediator.Reliability; do
            dotnet pack src/$project/*.csproj --configuration Release --no-build --no-restore -p:MinVerVersionOverride="$PACKAGE_VERSION" --output "$PACKAGE_OUTPUT"
          done
          commit="$(git rev-parse HEAD)"
          dotnet run --project tools/Boutquin.PackageVerification --configuration Release --no-build -- verify --spec eng/package-verification.json --artifacts "$PACKAGE_OUTPUT" --version "$PACKAGE_VERSION" --commit "$commit"
          dotnet run --project tools/Boutquin.PackageVerification --configuration Release --no-build -- record-hashes --spec eng/package-verification.json --artifacts "$PACKAGE_OUTPUT" --version "$PACKAGE_VERSION" --commit "$commit" --output "$PACKAGE_OUTPUT/package-hashes.json"
          dotnet run --project tools/Boutquin.PackageVerification --configuration Release --no-build -- verify --spec eng/package-verification.json --artifacts "$PACKAGE_OUTPUT" --version "$PACKAGE_VERSION" --commit "$commit" --hashes "$PACKAGE_OUTPUT/package-hashes.json"
          python3 scripts/check-package-docs.py "$PACKAGE_OUTPUT"
